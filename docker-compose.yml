services:
  gateway:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # 国内网络下 crates.io 直连会被 TLS 掐断，用镜像更稳。
        # 官方源可留空：CARGO_MIRROR=""
        CARGO_MIRROR: "${CARGO_MIRROR:-sparse+https://rsproxy.cn/index/}"
    image: gateway-panel:latest
    container_name: gateway-panel
    restart: unless-stopped

    ports:
      # 8790 给客户端程序（OpenAI / Anthropic / Responses 协议）
      - "${GATEWAY_PORT:-8790}:8790"
      # 8791 是管理面板；只想自己访问就改成 127.0.0.1:8791:8791
      - "${PANEL_PORT:-8791}:8791"

    environment:
      # ===== 面板登录（必填）=====
      PANEL_USERNAME: "${PANEL_USERNAME:-admin}"
      # 必填：留空则容器拒绝启动（本地调试可设 PANEL_ALLOW_OPEN=1 显式开放）。
      PANEL_PASSWORD: "${PANEL_PASSWORD:-}"
      # 固定它，重启后已登录的浏览器才不会掉线；留空则每次启动随机。
      PANEL_SECRET: "${PANEL_SECRET:-}"

      # ===== 凭据主密钥 =====
      # 不设则首次启动生成到 /data/gateway/secrets/gateway__master-key。
      # 一旦设置，请务必备份：丢了已存的账号凭据就解不开了。
      GATEWAY_MASTER_KEY: "${GATEWAY_MASTER_KEY:-}"

      # ===== 监听 =====
      GATEWAY_PORT: "8790"
      GATEWAY_BIND: "0.0.0.0"
      PANEL_PORT: "8791"
      PANEL_BIND: "0.0.0.0"

      # 客户端该把 base_url 指向哪里（面板「设置」里会显示这个地址）
      PUBLIC_BASE_URL: "${PUBLIC_BASE_URL:-}"

      # 影响"今天"的判定与每日动作（签到 / 猫猫旅行 / 每日对话）
      TZ: "${TZ:-Asia/Shanghai}"

      # ===== 仅部署自检 =====
      # 1 = 保留无凭据的假渠道，用来验证 /v1/* 转发链路（见 README「验证」）。
      # 验完请关掉，别长期开。
      GATEWAY_ALLOW_FAKE: "${GATEWAY_ALLOW_FAKE:-}"

    volumes:
      # 配置、SQLite（账号/用量/亲和）、主密钥都在这里 —— 必须持久化
      - ./data:/data

    # 账号池会同时打多个上游，默认的文件描述符上限偏小
    ulimits:
      nofile:
        soft: 65536
        hard: 65536

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
