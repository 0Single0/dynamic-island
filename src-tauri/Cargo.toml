[package]
name = "dynamic-island"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "dynamic_island_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-opener = "2"
tauri-plugin-window-state = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_Com",
    "Win32_System_Threading",
    "Win32_Security",
    # 网关的 402 停放需要 GetLocalTime 算「次日本地 04:00」。
    "Win32_System_SystemInformation",
] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "sync", "net"] }
reqwest = { version = "0.12", features = ["json", "stream"] }
tokio-tungstenite = "0.24"
futures-util = "0.3"
anyhow = "1"
base64 = "0.22"
tauri-plugin-dialog = "2"
webview2-com = "0.39"
windows-core = "0.62"
keyring = { version = "4.2.0", default-features = false, features = ["v1"] }
zeroize = { version = "1.8", features = ["alloc"] }
rusqlite = { version = "0.32", features = ["bundled"] }
async-trait = "0.1"
uiautomation = { version = "0.25.1", default-features = false, features = ["control", "input"] }
tempfile = "3"
quick-xml = { version = "0.38", features = ["serialize"] }
scraper = "0.24"
uuid = { version = "1.27.0", features = ["v4"] }
axum = "0.8.9"
sha2 = "0.10"
# WorkBuddy 指纹清洗：参考实现用正则识别身份声明（变体多，字面量替换不够）。
regex = "1"
# 华为云 SDK-HMAC-SHA256 请求签名（CodeArts 渠道每个请求都要签）。
hmac = "0.12"
aes-gcm = "0.11.1"
getrandom = "0.4.3"

[dev-dependencies]
# `test` 提供 mock runtime：验证命令 `State` 注册契约（见 lib.rs 的 state_wiring 测试）。
tauri = { version = "2", features = ["test"] }
tower = { version = "0.5.3", features = ["util"] }

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
# fat LTO 在本机 rustc（1.96, E:\CodexCaches 工具链）上链接大 bin 时会随机崩
# （ACCESS_VIOLATION / STACK_BUFFER_OVERRUN / ILLEGAL_INSTRUCTION 各出现过），
# 换 thin 后稳定。体积差 <2%，换稳定性。
lto = true
opt-level = 3
panic = "abort"
strip = true
